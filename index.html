<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>NPD Sourcing Tracker</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control bar + tabbed workspace; overview = KPI strip + project cards, detail tabs = dense tables */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef2f7; --fg:#18222f; --muted:#5d6b7c; --line:#d8dfe8;
  --accent:#0b5c8a; --accent-ink:#ffffff; --accent-soft:#dcebf5;
  --ok:#1d8a4e; --ok-soft:#dcf2e5; --warn:#b86e00; --warn-soft:#fdeccc; --bad:#c2372d; --bad-soft:#fbe1de; --idle:#6b7686; --idle-soft:#e7eaef;
  --p-common:#6a4fc7; --p-p1r5:#0d8c8c; --p-single:#d0611b; --p-6ds:#2f6fd6; --chip-ink:#ffffff;
  --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#161d27; --surface2:#1d2633; --fg:#e4e9f0; --muted:#97a3b3; --line:#2b3645;
  --accent:#4fa8dc; --accent-ink:#0b1520; --accent-soft:#183449;
  --ok:#4cc583; --ok-soft:#173326; --warn:#f0a63a; --warn-soft:#3a2a10; --bad:#f07067; --bad-soft:#3c1d1b; --idle:#9aa5b4; --idle-soft:#252e3a;
  --p-common:#a08cf0; --p-p1r5:#3cc4c4; --p-single:#f2924f; --p-6ds:#6ea2f5; --chip-ink:#0f141b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --surface2:#1d2633; --fg:#e4e9f0; --muted:#97a3b3; --line:#2b3645;
  --accent:#4fa8dc; --accent-ink:#0b1520; --accent-soft:#183449;
  --ok:#4cc583; --ok-soft:#173326; --warn:#f0a63a; --warn-soft:#3a2a10; --bad:#f07067; --bad-soft:#3c1d1b; --idle:#9aa5b4; --idle-soft:#252e3a;
  --p-common:#a08cf0; --p-p1r5:#3cc4c4; --p-single:#f2924f; --p-6ds:#6ea2f5; --chip-ink:#0f141b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font:800 20px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{filter:brightness(1.05)} .btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{font:600 13px var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-block:20px 48px}
.note{font-size:12px;color:var(--muted);margin:0 0 14px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:13px;z-index:20;max-width:min(420px,calc(100vw - 32px))}
h2{font:700 17px var(--display);margin:0 0 12px}
section+section{margin-top:28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:var(--accent)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{font:700 15px var(--display);margin:0;min-width:0}
.card .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Completed{background:var(--ok-soft);color:var(--ok)} .s-Ongoing{background:var(--warn-soft);color:var(--warn)}
.s-Delayed{background:var(--bad-soft);color:var(--bad)} .s-Hold,.s-Dropped,.s-none{background:var(--idle-soft);color:var(--idle)}
.proj{display:inline-block;font:600 11px var(--body);padding:2px 8px;border-radius:4px;color:var(--chip-ink);white-space:nowrap}
.proj-Common{background:var(--p-common)} .proj-P1R5{background:var(--p-p1r5)} .proj-Single{background:var(--p-single)} .proj-6DS{background:var(--p-6ds)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.alerts li:last-child{border-bottom:0}
.alerts b{font-weight:600}
.alerts .d{font:600 12px var(--mono);color:var(--bad);white-space:nowrap}
.alerts .r{grid-column:2;color:var(--muted);font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.tools input,.tools select{font:13px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0}
.tools input{flex:1 1 220px}
.chk{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.mono{font-family:var(--mono);font-size:12.5px}
.miss{background:var(--bad-soft);color:var(--bad);font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap}
.sm{color:var(--muted);font-size:12px}
details.pj{scroll-margin-top:140px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
details.pj>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
details.pj>summary::-webkit-details-marker{display:none}
details.pj>summary h3{font:700 15px var(--display);margin:0}
details.pj>summary .meter{grid-column:1/-1}
details.pj[open]>summary{border-bottom:1px solid var(--line)}
.steps td:first-child{width:44px;text-align:center;color:var(--muted)}
.dt{font:12.5px var(--mono);white-space:nowrap}
.dt.late{color:var(--bad);font-weight:500}
.dt.done{color:var(--ok)}
.flag{font:600 11px var(--body);border-radius:4px;padding:2px 6px;white-space:nowrap}
.flag.late{background:var(--bad-soft);color:var(--bad)} .flag.soon{background:var(--warn-soft);color:var(--warn)} .flag.done{background:var(--ok-soft);color:var(--ok)}
.cmp td:first-child{font-weight:500}
tr.sec td{background:var(--accent-soft);font:700 12px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
tr.tot td{font-weight:700;background:var(--surface2)}
.save{color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .5s ease}}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.h2row h2{margin:0}
.sm-btn{padding:5px 10px;font-size:12px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.savestate{font-size:12px;color:var(--ok);font-weight:600;align-self:center}.savestate.warn{color:var(--warn)}
tr.click{cursor:pointer}tr.click:focus-visible td{outline:2px solid var(--accent);outline-offset:-2px}
.pjbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.loss{color:var(--bad);font-weight:700}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 45%,transparent);z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);color:var(--fg);border-radius:10px;border:1px solid var(--line);width:min(720px,100%);padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}.fld small{font-size:11px;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:13px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.fld .chk input{width:auto;padding:0}.fld .chk{color:var(--fg)}
.req{color:var(--bad)}.ferr{color:var(--bad);font-size:13px;margin:12px 0 0}
[hidden]{display:none!important}
.filebtn.ok{color:var(--ok);border-color:var(--ok)}.filebtn.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.mact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>NPD Sourcing Tracker</h1><small id="srcline">E&amp;E BOP · Alternate development · Sun Mobility CPMO</small></div>
      <div class="actions">
        <input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden>
        <span class="savestate" id="saveState"></span>
        <button class="btn" id="keepBtn" type="button" hidden>Save loaded data</button>
        <input type="file" id="rfile" accept=".json" hidden>
        <button class="btn filebtn" id="fileBtn" type="button" hidden>Link data file</button>
        <button class="btn" id="loadBtn" type="button">⤒ Load Excel</button>
        <button class="btn" id="restoreBtn" type="button">Restore</button>
        <button class="btn" id="backupBtn" type="button">Backup</button>
        <button class="btn primary" id="exportBtn" type="button">⤓ Export Excel</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden></div>

<script src="xlsx.full.min.js"></script>

</body>
</html>
